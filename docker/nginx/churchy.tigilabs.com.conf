# Churchy : une seule origine. Le web (Next.js) sert tout, sauf /api qui va à l'API (NestJS).
# Même origine => pas de CORS, cookies de session valides sans attribut Domain.
# Installé dans ~/infra/nginx/conf.d/ (nginx-proxy). Dépend de 00-hardening-http.conf (zones rl_*)
# et de 99-hardening-server.inc.

server {
  listen 80;
  listen [::]:80;

  server_name churchy.tigilabs.com;

  include /etc/nginx/conf.d/99-hardening-server.inc;
  client_max_body_size 5m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name churchy.tigilabs.com;

  ssl_certificate     /etc/letsencrypt/live/churchy.tigilabs.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/churchy.tigilabs.com/privkey.pem;

  include /etc/nginx/conf.d/99-hardening-server.inc;
  client_max_body_size 5m;

  # Résolution DNS à chaque requête (DNS interne de Docker) : les conteneurs sont recréés à chaque
  # déploiement avec une nouvelle IP, et nginx démarre même si l'app est arrêtée.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $churchy_api http://churchy-api:3201;
  set $churchy_web http://churchy-web:3200;

  # Swagger : réservé au développement (le navigateur n'en a pas besoin).
  location ^~ /api/docs { return 404; }

  # API NestJS. IP cliente transmise : l'API lit X-Forwarded-For (TRUST_PROXY_HOPS=1).
  location /api/ {
    limit_req zone=rl_api burst=40 nodelay;
    limit_req_status 429;

    proxy_pass $churchy_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }

  # Site web Next.js.
  location / {
    limit_req zone=rl_global burst=30 nodelay;
    limit_req_status 429;

    proxy_pass $churchy_web;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
  }
}
