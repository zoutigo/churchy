name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs en parallèle : la durée totale est celle du plus long (Playwright), pas la somme.
jobs:
  quality:
    name: Qualité (docs, lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      CI: 'true'
      HUSKY: '0'
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Client Prisma
        run: npm run prisma:generate -w @churchy/api

      - name: Cohérence CLAUDE.md / AGENTS.md
        run: node scripts/agent-docs.mjs check

      - name: Lint et formatage
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      CI: 'true'
      HUSKY: '0'
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Client Prisma
        run: npm run prisma:generate -w @churchy/api

      - name: Tests unitaires
        run: npm test

  e2e-api:
    name: Tests fonctionnels API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # Mêmes ports que le docker-compose.yml de dev : les tests fonctionnels n'ont rien à configurer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: churchy_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d churchy_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: 'true'
      HUSKY: '0'
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Client Prisma
        run: npm run prisma:generate -w @churchy/api

      - name: Tests fonctionnels API
        run: npx turbo run test:e2e --filter=@churchy/api

  # Calcule le nombre de shards d'après le nombre de tests (apps/web/scripts/e2e-shards.mjs) :
  # il augmente tout seul quand la suite Playwright grossit.
  e2e-web-plan:
    name: Découpage Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Nombre de shards
        id: plan
        working-directory: apps/web
        run: |
          plan=$(npx playwright test --list --reporter=json | node scripts/e2e-shards.mjs)
          echo "$plan"
          # Une matrice ne contient que des listes : {"shard":[1,2,3]} ; le total est exposé à part.
          echo "matrix=$(echo "$plan" | node -p 'JSON.stringify({ shard: JSON.parse(require("fs").readFileSync(0, "utf8")).shard })')" >> "$GITHUB_OUTPUT"
          echo "total=$(echo "$plan" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).total')" >> "$GITHUB_OUTPUT"

  e2e-web:
    name: Tests fonctionnels web (${{ matrix.shard }}/${{ needs.e2e-web-plan.outputs.total }})
    needs: e2e-web-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-web-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # Mêmes ports que le docker-compose.yml de dev : les tests fonctionnels n'ont rien à configurer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: churchy_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d churchy_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: 'true'
      HUSKY: '0'
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Client Prisma
        run: npm run prisma:generate -w @churchy/api

      # Le serveur API lancé par Playwright a besoin des paquets partagés compilés (shared, contracts).
      - name: Build des paquets partagés
        run: npx turbo run build --filter='./packages/*'

      - name: Navigateur pour les tests fonctionnels
        run: npx playwright install --with-deps chromium webkit firefox
        working-directory: apps/web

      - name: Tests fonctionnels web (Playwright)
        run: npx turbo run test:e2e --filter=@churchy/web -- --shard=${{ matrix.shard }}/${{ needs.e2e-web-plan.outputs.total }}

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
