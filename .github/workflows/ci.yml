name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # Mêmes ports que le docker-compose.yml de dev : les tests fonctionnels n'ont rien à configurer.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: churchy_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d churchy_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: 'true'
      HUSKY: '0'
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Client Prisma
        run: npm run prisma:generate -w @churchy/api

      - name: Cohérence CLAUDE.md / AGENTS.md
        run: node scripts/agent-docs.mjs check

      - name: Lint et formatage
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm test

      - name: Navigateur pour les tests fonctionnels
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Tests fonctionnels (API puis web)
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
